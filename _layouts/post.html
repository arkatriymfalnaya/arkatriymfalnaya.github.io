---
layout: default
---
<div class="grid-container">
  
  <article class="post__article" itemscope itemtype="http://schema.org/BlogPosting">

    <header class="post__header">
      <h1 class="post__title" itemprop="name headline">{{ page.title }}</h1>
      <p class="post__date"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p>
    </header>

    <div class="post__content" itemprop="articleBody">
      {{ content }}
    </div>

  </article>
  
</div>
