---
layout: default
---
<div class="grid-container">
  
  <article class="article" itemscope itemtype="http://schema.org/BlogPosting">

    <header class="article__header">
      <img class="article__pic" src="{{ site.baseurl }}/{{ page.pic }}" alt="{{ page.title }}">
      <h1 class="article__title" itemprop="name headline">{{ page.title }}</h1>
      <p class="article__date"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p>
    </header>

    <div class="article__content" itemprop="articleBody">
      {{ content }}
    </div>

  </article>
  
</div>

<div id="galleryModal" class="gallery-modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="img01">
  <div id="caption"></div>
</div>
